<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg-gradient)"/>
  
  <!-- Main Wallet / Ledger -->
  <g filter="url(#shadow)">
    <rect x="96" y="128" width="320" height="256" rx="36" fill="#ffffff"/>
    
    <!-- Accent line stripes (Ledger rows) -->
    <rect x="136" y="180" width="85" height="16" rx="8" fill="#2563eb"/>
    <rect x="136" y="216" width="95" height="14" rx="7" fill="#93c5fd"/>
    <rect x="136" y="250" width="75" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="136" y="286" width="105" height="16" rx="8" fill="#10b981"/>
    
    <!-- Right side pocket flap -->
    <rect x="256" y="196" width="160" height="120" rx="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
    
    <!-- Gold Coin / Clasp Lock -->
    <circle cx="350" cy="256" r="22" fill="#fbbf24" stroke="#d97706" stroke-width="4"/>
    <path d="M344 246h12v20h-12z" fill="#b45309" opacity="0.2"/>
    <circle cx="350" cy="256" r="10" fill="#fef3c7"/>
  </g>
</svg>
